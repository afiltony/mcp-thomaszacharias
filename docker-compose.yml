# Local Docker deployment. Secrets and DATABASE_URL come from .env.docker (git-ignored).
#   Supabase (project vsiffhahvmwmnsjqwlci):  docker compose up -d --build
#   Local Postgres instead:                   docker compose --profile localdb up -d --build
#     with DATABASE_URL=postgresql://mcp:mcp@db:5432/mcp?sslmode=disable in .env.docker
# Production (Cloud Run + Supabase) does not use this file.
services:
  db:
    image: postgres:17-alpine
    profiles: [localdb]
    environment:
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: mcp
      POSTGRES_DB: mcp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp -d mcp"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: thomaszacharias-mcp:local
    depends_on:
      db:
        condition: service_healthy
        required: false
    env_file: .env.docker
    environment:
      # development: production mode would require the real UD key, Supabase URL and public HTTPS origin
      NODE_ENV: development
      TRUST_PROXY: "false"
      AUTO_MIGRATE: "true"
      PUBLIC_BASE_URL: http://localhost:8080
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
